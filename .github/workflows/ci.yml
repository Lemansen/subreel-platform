name: CI

on:
  push:
    branches: [main, "feature/**", "sync/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Заглушки: сборке нужны переменные, но реальный Supabase не вызывается.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
